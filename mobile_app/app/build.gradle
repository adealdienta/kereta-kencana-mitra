plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.keretakencana.mitra'
    compileSdk 34

    defaultConfig {
        applicationId "com.keretakencana.mitra"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Ganti via gradle.properties (-PAPI_BASE_URL=https://domain-web.com/api/v1/) saat hosting online
        def configuredBaseUrl = (project.findProperty("API_BASE_URL") ?: "http://192.168.1.7/api/v1/").toString()
        buildConfigField "String", "API_BASE_URL", "\"${configuredBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX & UI Dasar
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Networking / REST API (Retrofit 2 & OkHttp)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Pemuat Gambar Produk (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Coroutines & Lifecycle (Asynchronous)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // QR Code Generator (ZXing)
    implementation 'com.google.zxing:core:3.5.3'
}
